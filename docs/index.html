<!doctype html>
<html lang="en" data-mode="write">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#1f4e79" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14181d" media="(prefers-color-scheme: dark)">
<meta name="description" content="Write a draft, then revise it. Inkstand works offline on phones, tablets and computers, in English and nine Indian languages.">
<title>Inkstand</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="app.031a2cba52.css">
<script type="module" src="app.189a9338cd.js"></script>
</head>
<body>

<div class="app" id="app" data-view="editor">
<aside class="sidebar" id="sidebar" aria-labelledby="docs-heading">
<header class="sidebar-head">
<h1 id="docs-heading" data-i18n="documents">Documents</h1>
<button class="icon-btn" id="settingsBtn" data-i18n-label="settings"><svg><use href="#i-settings"/></svg></button>
<button class="primary-btn" id="newDocBtn"><svg><use href="#i-plus"/></svg><span data-i18n="newDocument">New document</span></button>
</header>
<ul class="doc-list" id="docList" role="list"></ul>
</aside>
<main class="main">
<header class="topbar">
<button class="icon-btn only-narrow" id="showListBtn" data-i18n-label="documents"><svg><use href="#i-back"/></svg></button>
<input class="title-input" id="titleInput" type="text" autocomplete="off" data-i18n-placeholder="titlePlaceholder" data-i18n-label="titlePlaceholder" maxlength="200">
<div class="mode-switch" role="radiogroup" data-i18n-label="mode">
<button type="button" role="radio" id="writeModeBtn" data-mode="write" aria-checked="true" data-i18n="write">Write</button>
<button type="button" role="radio" id="reviseModeBtn" data-mode="revise" aria-checked="false" data-i18n="revise">Revise</button>
</div>
<button class="icon-btn only-wide" id="focusBtn" data-i18n-label="focus" aria-pressed="false"><svg><use href="#i-focus"/></svg></button>
<button class="icon-btn" id="historyBtn" data-i18n-label="history"><svg><use href="#i-history"/></svg></button>
<button class="icon-btn" id="moreBtn" data-i18n-label="more" aria-haspopup="dialog"><svg><use href="#i-more"/></svg></button>
</header>
<div class="toolbar" role="toolbar" id="toolbar" data-i18n-label="menu">
<button data-cmd="undo" data-i18n-label="undo"><svg><use href="#i-undo"/></svg></button>
<button data-cmd="redo" data-i18n-label="redo"><svg><use href="#i-redo"/></svg></button>
<span class="sep" aria-hidden="true"></span>
<button data-cmd="bold" data-i18n-label="bold" aria-pressed="false"><b>B</b></button>
<button data-cmd="italic" data-i18n-label="italic" aria-pressed="false"><i>I</i></button>
<button data-cmd="underline" data-i18n-label="underline" aria-pressed="false"><u>U</u></button>
<button data-cmd="strikeThrough" data-i18n-label="strike" aria-pressed="false"><s>S</s></button>
<span class="sep" aria-hidden="true"></span>
<button data-block="h1" data-i18n-label="heading1" aria-pressed="false">H1</button>
<button data-block="h2" data-i18n-label="heading2" aria-pressed="false">H2</button>
<button data-block="p" data-i18n-label="paragraph" aria-pressed="false">¶</button>
<button data-block="blockquote" data-i18n-label="quote" aria-pressed="false"><svg><use href="#i-quote"/></svg></button>
<span class="sep" aria-hidden="true"></span>
<button data-cmd="insertUnorderedList" data-i18n-label="bulletList" aria-pressed="false"><svg><use href="#i-ul"/></svg></button>
<button data-cmd="insertOrderedList" data-i18n-label="numberedList" aria-pressed="false"><svg><use href="#i-ol"/></svg></button>
</div>
<div class="page-scroll" id="pageScroll">
<article class="editor" id="editor" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" data-i18n-placeholder="writePlaceholder" data-i18n-label="writePlaceholder"></article>
</div>
<button class="notes-fab" id="notesFab" type="button" hidden><svg><use href="#i-notes"/></svg><span id="notesFabText"></span></button>
<footer class="statusbar">
<span id="saveStatus" role="status" aria-live="polite"></span>
<span id="wordCount" class="count"></span>
</footer>
</main>
<aside class="revise" id="revisePanel" aria-labelledby="revise-heading">
<header class="revise-head">
<h2 id="revise-heading" data-i18n="revise">Revise</h2>
<button class="secondary-btn only-narrow" id="closeReviseBtn" type="button" data-i18n="backToWriting">Back to writing</button>
</header>
<div class="revise-body">
<section class="r-card">
<label for="argumentInput" class="r-title" data-i18n="argument">Central argument</label>
<p class="r-hint" data-i18n="argumentHint"></p>
<textarea id="argumentInput" rows="3" maxlength="600"></textarea>
<p class="r-meta" id="argumentCount" aria-live="polite"></p>
</section>
<section class="r-card">
<h3 class="r-title" data-i18n="rhythm">Rhythm</h3>
<p class="r-hint" data-i18n="rhythmHint"></p>
<div class="rhythm-strip" id="rhythmStrip" role="img"></div>
<ul class="legend" id="rhythmLegend" role="list"></ul>
<label class="check"><input type="checkbox" id="rhythmToggle" checked> <span data-i18n="showRhythm"></span></label>
<p class="r-meta" id="reviseStats"></p>
</section>
<section class="r-card">
<h3 class="r-title" data-i18n="notes">Notes</h3>
<p class="r-hint" id="englishNote" data-i18n="englishOnly" hidden></p>
<div id="findingList"></div>
</section>
<section class="r-card">
<h3 class="r-title" data-i18n="openingEnding">Opening and ending</h3>
<p class="r-hint" data-i18n="openingQ"></p>
<blockquote class="r-excerpt" id="openingText"></blockquote>
<p class="r-hint" data-i18n="endingQ"></p>
<blockquote class="r-excerpt" id="endingText"></blockquote>
</section>
<div class="r-actions">
<button class="secondary-btn" id="guideBtn" type="button"><svg><use href="#i-guide"/></svg><span data-i18n="guide">Craft guide</span></button>
<button class="secondary-btn" id="practiceBtn" type="button"><svg><use href="#i-practice"/></svg><span data-i18n="practice">Practice sheet</span></button>
</div>
</div>
</aside>
</div>
<dialog class="sheet" id="moreDialog">
<form method="dialog" class="sheet-body">
<h2 data-i18n="export">Export</h2>
<button value="docx" class="row-btn"><svg><use href="#i-download"/></svg><span data-i18n="exportDocx"></span></button>
<button value="html" class="row-btn"><svg><use href="#i-download"/></svg><span data-i18n="exportHtml"></span></button>
<button value="txt" class="row-btn"><svg><use href="#i-download"/></svg><span data-i18n="exportTxt"></span></button>
<hr>
<button value="import" class="row-btn"><svg><use href="#i-open"/></svg><span data-i18n="import"></span></button>
<button value="settings" class="row-btn"><svg><use href="#i-settings"/></svg><span data-i18n="settings"></span></button>
<button value="delete" class="row-btn danger"><svg><use href="#i-trash"/></svg><span data-i18n="delete"></span></button>
<button value="cancel" class="row-btn subtle"><svg><use href="#i-close"/></svg><span data-i18n="close"></span></button>
</form>
</dialog>
<dialog class="sheet" id="historyDialog">
<div class="sheet-body">
<div class="sheet-head">
<h2 data-i18n="history">Version history</h2>
<button class="icon-btn" data-close data-i18n-label="close"><svg><use href="#i-close"/></svg></button>
</div>
<ul class="history-list" id="historyList" role="list"></ul>
</div>
</dialog>
<dialog class="sheet" id="settingsDialog">
<div class="sheet-body">
<div class="sheet-head">
<h2 data-i18n="settings">Settings</h2>
<button class="icon-btn" data-close data-i18n-label="close"><svg><use href="#i-close"/></svg></button>
</div>
<label class="field">
<span data-i18n="language">Language</span>
<select id="languageSelect"></select>
</label>
<label class="field">
<span data-i18n="theme">Theme</span>
<select id="themeSelect">
<option value="system" data-i18n="themeSystem">Match device</option>
<option value="light" data-i18n="themeLight">Light</option>
<option value="sepia" data-i18n="themeSepia">Paper</option>
<option value="dark" data-i18n="themeDark">Dark</option>
</select>
</label>
<label class="field">
<span data-i18n="pageFont">Page font</span>
<select id="fontSelect">
<option value="serif" data-i18n="fontSerif">Serif</option>
<option value="sans" data-i18n="fontSans">Sans serif</option>
</select>
</label>
<div class="field">
<span data-i18n="textSize">Text size</span>
<div class="stepper">
<button class="icon-btn" id="smallerBtn" data-i18n-label="smaller">A−</button>
<output id="textSizeValue"></output>
<button class="icon-btn" id="largerBtn" data-i18n-label="larger">A+</button>
</div>
</div>
</div>
</dialog>
<dialog class="sheet guide-sheet" id="guideDialog">
<div class="sheet-body">
<div class="sheet-head">
<h2 data-i18n="guide">Craft guide</h2>
<button class="icon-btn" data-close data-i18n-label="close"><svg><use href="#i-close"/></svg></button>
</div>
<p class="r-hint" data-i18n="guideEnglish"></p>
<div class="guide-body" id="guideBody" lang="en"></div>
</div>
</dialog>
<dialog class="sheet" id="confirmDialog">
<form method="dialog" class="sheet-body">
<p id="confirmText"></p>
<div class="actions">
<button value="cancel" class="secondary-btn" data-i18n="cancel">Cancel</button>
<button value="ok" class="danger-btn" id="confirmOk" data-i18n="delete">Delete</button>
</div>
</form>
</dialog>
<input type="file" id="fileInput" accept=".docx,.html,.htm,.txt,application/vnd.openxmlformats-officedocument.wordprocessingml.document,text/html,text/plain" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
